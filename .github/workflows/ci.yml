name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check coverage
        run: |
          pnpm test:cov --coverageReporters=json-summary
          node -e "const pct = require('./coverage/coverage-summary.json').total.lines.pct; console.log('Total line coverage: ' + pct + '%'); if (pct < 80) { console.error('Coverage ' + pct + '% is below 80% threshold'); process.exit(1); }"

  integration-e2e-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokemon_saga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokemon_saga_test
        run: pnpm db:migrate
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokemon_saga_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
        run: pnpm test:integration
      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokemon_saga_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
        run: pnpm test:e2e

  tdd-enforcement:
    name: TDD & Migration Enforcement
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify migrations exist for schema changes
        run: |
          CHANGED_SCHEMA=$(git diff --name-only origin/develop...HEAD | grep '^src/database/schema/' || true)
          if [ -n "$CHANGED_SCHEMA" ]; then
            CHANGED_MIGRATIONS=$(git diff --name-only origin/develop...HEAD | grep '^src/database/migrations/' || true)
            if [ -z "$CHANGED_MIGRATIONS" ]; then
              echo "ERROR: Schema changed but no migration files found"
              echo "Run 'pnpm db:generate' and commit the migration"
              exit 1
            fi
          fi
      - name: Verify tests exist for changed files
        run: |
          CHANGED_SRC=$(git diff --name-only origin/develop...HEAD | grep '^src/.*\.ts$' | grep -v '\.spec\.ts$' | grep -v '\.test\.ts$' || true)
          if [ -n "$CHANGED_SRC" ]; then
            for file in $CHANGED_SRC; do
              TEST_FILE="${file%.ts}.spec.ts"
              if [ ! -f "$TEST_FILE" ]; then
                echo "ERROR: No test file found for $file (expected $TEST_FILE)"
                echo "TDD requires a failing test before implementation."
                exit 1
              fi
            done
          fi
      - name: Verify test coverage does not decrease
        run: |
          pnpm test:cov --coverageReporters=json-summary
          node -e "const pct = require('./coverage/coverage-summary.json').total.lines.pct; console.log('Total line coverage: ' + pct + '%'); if (pct < 80) { console.error('Coverage ' + pct + '% is below 80% threshold'); process.exit(1); }"
