name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check coverage against 80% threshold
        run: |
          pnpm test:cov --coverageReporters=json-summary
          node -e "const pct = require('./coverage/coverage-summary.json').total.lines.pct; console.log('Total line coverage: ' + pct + '%'); if (pct < 80) { console.error('Coverage ' + pct + '% is below 80% threshold'); process.exit(1); }"

  integration-e2e-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokemon_saga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokemon_saga_test
        run: pnpm db:migrate
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokemon_saga_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
        run: pnpm test:integration
      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokemon_saga_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
        run: pnpm test:e2e

  tdd-enforcement:
    name: TDD & Migration Enforcement
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so origin/develop exists as a diff base on every event
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify state docs updated
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin develop
          CHANGED_FILES=$(git diff --name-only origin/develop...HEAD)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No diff against origin/develop; nothing to verify."
            exit 0
          fi

          # Every PR must journal its outcome in State.md (AGENTS.md -> Task Tracking).
          if ! echo "$CHANGED_FILES" | grep -qx 'State.md'; then
            echo "ERROR: State.md was not updated by this PR."
            echo "Every PR must record its outcome in State.md (AGENTS.md -> Task Tracking)."
            exit 1
          fi

          # Task branches additionally own their checkbox and their journal entry.
          if echo "$HEAD_REF" | grep -qE '^feature/task-[0-9]+-'; then
            TASK_ID=$(echo "$HEAD_REF" | sed -nE 's#^feature/(task-[0-9]+)-.*#\1#p' | tr '[:lower:]' '[:upper:]')
            if ! echo "$CHANGED_FILES" | grep -qx 'TASKS.md'; then
              echo "ERROR: $TASK_ID changed but TASKS.md was not updated."
              exit 1
            fi
            if ! git diff origin/develop...HEAD -- TASKS.md | grep -qE "^\+.*\[x\].*\*\*$TASK_ID"; then
              echo "ERROR: TASKS.md does not mark $TASK_ID as completed (- [x] **$TASK_ID**)."
              exit 1
            fi
            if ! git diff origin/develop...HEAD -- State.md | grep -qi "$TASK_ID"; then
              echo "ERROR: State.md does not mention $TASK_ID."
              exit 1
            fi
          fi
      - name: Verify migrations exist for schema changes
        run: |
          CHANGED_FILES=$(git diff --name-only origin/develop...HEAD)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No diff against origin/develop; nothing to verify."
            exit 0
          fi
          CHANGED_SCHEMA=$(echo "$CHANGED_FILES" | grep '^src/database/schema/' || true)
          if [ -n "$CHANGED_SCHEMA" ]; then
            CHANGED_MIGRATIONS=$(echo "$CHANGED_FILES" | grep '^src/database/migrations/' || true)
            if [ -z "$CHANGED_MIGRATIONS" ]; then
              echo "ERROR: Schema changed but no migration files found"
              echo "Run 'pnpm db:generate' and commit the migration"
              exit 1
            fi
          fi
      - name: Verify tests exist for changed files
        run: |
          # Units with dedicated specs are required for logic-bearing files.
          # Excluded by convention (no unit-testable logic of their own):
          # entry point, Nest modules, Drizzle schema definitions, barrels.
          CHANGED_FILES=$(git diff --name-only origin/develop...HEAD)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No diff against origin/develop; nothing to verify."
            exit 0
          fi
          CHANGED_SRC=$(echo "$CHANGED_FILES" \
            | grep '^src/.*\.ts$' \
            | grep -v '\.spec\.ts$' \
            | grep -v '\.test\.ts$' \
            | grep -v '^src/main\.ts$' \
            | grep -v '\.module\.ts$' \
            | grep -v '^src/database/schema/' \
            | grep -v '/index\.ts$' \
            || true)
          if [ -n "$CHANGED_SRC" ]; then
            for file in $CHANGED_SRC; do
              TEST_FILE="${file%.ts}.spec.ts"
              if [ ! -f "$TEST_FILE" ]; then
                echo "ERROR: No test file found for $file (expected $TEST_FILE)"
                echo "TDD requires a failing test before implementation."
                exit 1
              fi
            done
          fi
